# litellm_config.yaml
model_list:
  # =========================================================================
  # 1. THE PLANNER: Cerebras GLM-4.7 Pool (~1,000 tok/s)
  # =========================================================================
  - model_name: gem-asea-planner
    litellm_params:
      model: cerebras/gpt-oss-120b
      api_key: os.environ/CEREBRAS_API_KEY
      rpm: 30
      extra_body:
        reasoning_effort: none
        reasoning_format: hidden
  - model_name: gem-asea-planner-fallback
    litellm_params:
      model: cerebras/zai-glm-4.7
      api_key: os.environ/CEREBRAS_API_KEY
      rpm: 30
      extra_body:
        reasoning_format: hidden

  # =========================================================================
  # 2. THE CODER: NVIDIA Nemotron Pool
  # =========================================================================
  - model_name: gem-asea-coder
    litellm_params:
      #model: openai/nvidia/nemotron-3-ultra-550b-a55b
      model: openai/deepseek-ai/deepseek-v4-flash
      api_base: https://integrate.api.nvidia.com/v1
      api_key: os.environ/NVIDIA_API_KEY
      rpm: 30
  - model_name: gem-asea-coder-fallback
    litellm_params:
      model: groq/llama-3.3-70b-versatile
      api_key: os.environ/GROQ_API_KEY
      rpm: 30
      #extra_body:
       # reasoning_format: hidden

  # =========================================================================
  # 3. THE CRITIC: Groq Qwen-2.5 Pool
  # =========================================================================
  - model_name: gem-asea-critic
    litellm_params:
      model: groq/llama-3.3-70b-versatile 
      api_key: os.environ/GROQ_API_KEY
      rpm: 30
  - model_name: gem-asea-critic
    litellm_params:
      model: groq/qwen/qwen3-32b
      api_key: os.environ/GROQ_API_KEY
      rpm: 30
router_settings:
  routing_strategy: simple-shuffle  #  Correct LiteLLM nomenclature
  cooldown_time: 30
  num_retries: 3
  fallbacks:
    - gem-asea-coder: ["gem-asea-coder-fallback"]
    - gem-asea-planner: ["gem-asea-planner-fallback"]
    - gem-asea-critic : ["gem-asea-planner"]
litellm_settings:
  drop_params: true